<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:transparent !important;
}
#stage{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
  background:transparent;
}
#lia{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  background:transparent;
  opacity:1;
}
</style>
</head>
<body>
<div id="stage">
  <video id="lia" playsinline preload="auto"></video>
</div>
<script>
(() => {
  const v = document.getElementById('lia');
  const params = new URLSearchParams(location.search);
  const file = params.get('file') || 'lia_transparente.webm';
  v.src = file;

  // Primeiro garante a IMAGEM: autoplay mudo é aceito pelo Chromium/WebView2.
  // Depois tenta liberar o áudio. Mesmo que o áudio seja bloqueado, a LIA aparece.
  async function startLia(){
    try{
      v.currentTime = 0;
      v.muted = true;
      v.volume = 1;
      await v.play();
      setTimeout(() => {
        try { v.muted = false; } catch(e) {}
      }, 180);
    }catch(e){
      try{ window.chrome.webview.postMessage('video_erro:' + (e.message || e)); }catch(_){}
    }
  }

  v.addEventListener('ended', () => {
    try{ window.chrome.webview.postMessage('video_terminou'); }catch(e){}
  });

  v.addEventListener('error', () => {
    const code = v.error ? v.error.code : 0;
    try{ window.chrome.webview.postMessage('video_erro_media:' + code); }catch(e){}
  });

  if (document.readyState === 'complete') startLia();
  else window.addEventListener('load', startLia, {once:true});
})();
</script>
</body>
</html>
