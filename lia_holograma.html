<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
body{font-family:Segoe UI,Arial,sans-serif}
#stage{position:absolute;inset:0;overflow:hidden;filter:drop-shadow(0 0 10px rgba(0,210,255,.85))}
#beam{position:absolute;left:16%;right:16%;bottom:4%;height:78%;
 background:linear-gradient(to top,rgba(0,220,255,.30),rgba(0,180,255,.08) 58%,transparent);
 clip-path:polygon(43% 100%,57% 100%,86% 0,14% 0);filter:blur(8px);animation:beam 2.4s ease-in-out infinite}
#lia{position:absolute;left:5%;right:5%;bottom:6%;width:90%;height:90%;object-fit:contain;
 opacity:.72;mix-blend-mode:screen;
 filter:saturate(1.35) contrast(1.12) brightness(1.18) drop-shadow(0 0 6px #00d9ff) drop-shadow(0 0 18px #008cff);
 animation:flicker 3.8s infinite}
.scan{position:absolute;inset:0;pointer-events:none;
 background:repeating-linear-gradient(to bottom,rgba(255,255,255,.08) 0 1px,rgba(0,210,255,.02) 1px 4px);
 mix-blend-mode:screen;opacity:.55;animation:scan 5s linear infinite}
.glitch{position:absolute;left:8%;right:8%;height:3px;background:#aaf8ff;opacity:0;
 box-shadow:0 0 10px #00d9ff;animation:glitch 4.7s infinite}
#g1{top:28%} #g2{top:51%;animation-delay:1.4s} #g3{top:69%;animation-delay:2.6s}
#base{position:absolute;left:19%;right:19%;bottom:2%;height:9%;border:2px solid rgba(80,235,255,.85);
 border-radius:50%;box-shadow:0 0 8px #00d9ff,0 0 25px #00aaff,inset 0 0 20px rgba(0,220,255,.6);
 transform:perspective(180px) rotateX(66deg);animation:pulse 1.8s ease-in-out infinite}
#core{position:absolute;left:44%;right:44%;bottom:4%;height:4%;border-radius:50%;background:#dfffff;
 box-shadow:0 0 12px #fff,0 0 30px #00d9ff,0 0 55px #009cff;animation:pulse 1.1s ease-in-out infinite}
.p{position:absolute;width:3px;height:3px;border-radius:50%;background:#8ef7ff;box-shadow:0 0 7px #00d9ff;
 opacity:0;animation:particle 3s linear infinite}
@keyframes flicker{0%,18%,22%,24%,53%,55%,100%{opacity:.72;transform:translateX(0) scaleY(1)}
19%{opacity:.48;transform:translateX(2px)}23%{opacity:.82;transform:translateX(-2px)}
54%{opacity:.58;transform:translateX(1px) scaleY(.997)}}
@keyframes beam{50%{opacity:.62;filter:blur(11px)}}
@keyframes scan{to{background-position:0 40px}}
@keyframes glitch{0%,92%,100%{opacity:0;transform:translateX(0)}93%{opacity:.7;transform:translateX(-12px)}
94%{opacity:.25;transform:translateX(16px)}95%{opacity:0}}
@keyframes pulse{50%{opacity:.62;transform:perspective(180px) rotateX(66deg) scale(.94)}}
@keyframes particle{0%{opacity:0;transform:translateY(0)}20%{opacity:.9}100%{opacity:0;transform:translateY(-260px)}}
</style>
</head>
<body>
<div id="stage">
  <div id="beam"></div>
  <img id="lia" src="lia_holograma.png">
  <div class="scan"></div>
  <div class="glitch" id="g1"></div><div class="glitch" id="g2"></div><div class="glitch" id="g3"></div>
  <div id="base"></div><div id="core"></div>
</div>
<script>
const s=document.getElementById('stage');
for(let i=0;i<34;i++){let p=document.createElement('i');p.className='p';
 p.style.left=(18+Math.random()*64)+'%';p.style.bottom=(6+Math.random()*28)+'%';
 p.style.animationDelay=(Math.random()*3)+'s';p.style.animationDuration=(2+Math.random()*2.6)+'s';s.appendChild(p);}
</script>
</body>
</html>
